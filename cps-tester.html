<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PulseTap — CPS Tester</title>
  <style>
    :root { --bg:#090b18; --card:rgba(20,24,52,.78); --text:#f7f7ff; --muted:#a9afcf; --accent:#8b5cf6; --accent2:#22d3ee; --good:#45e0a3; }
    * { box-sizing:border-box; }
    body { min-height:100vh; margin:0; color:var(--text); font:16px/1.45 Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif; background:radial-gradient(circle at 18% 8%,#36216c 0,transparent 31rem),radial-gradient(circle at 88% 90%,#064f65 0,transparent 28rem),var(--bg); display:grid; place-items:center; overflow-x:hidden; }
    .app { width:min(920px,calc(100% - 32px)); padding:32px 0; }
    header { display:flex; justify-content:space-between; align-items:center; gap:20px; margin-bottom:22px; }
    .brand { display:flex; align-items:center; gap:12px; font-size:1.25rem; font-weight:800; letter-spacing:-.03em; }
    .bolt { width:36px; height:36px; display:grid; place-items:center; border-radius:12px; background:linear-gradient(135deg,var(--accent),var(--accent2)); box-shadow:0 10px 25px #6d4aea70; }
    .pill { color:#d9d7ff; background:#ffffff10; border:1px solid #ffffff1b; padding:7px 12px; border-radius:999px; font-size:.82rem; }
    .panel { padding:clamp(22px,5vw,48px); border:1px solid #ffffff1a; border-radius:28px; background:var(--card); box-shadow:0 30px 70px #00000055; backdrop-filter:blur(18px); }
    .topline { display:flex; justify-content:space-between; align-items:flex-end; gap:20px; margin-bottom:27px; }
    h1 { margin:0; font-size:clamp(1.7rem,5vw,3.25rem); letter-spacing:-.055em; line-height:1.05; }
    .subtitle { color:var(--muted); margin:9px 0 0; }
    .time { min-width:110px; text-align:right; }
    .time b { display:block; font-size:2.1rem; letter-spacing:-.06em; color:var(--accent2); }
    .time span { color:var(--muted); font-size:.78rem; text-transform:uppercase; letter-spacing:.1em; }
    .click-zone { position:relative; height:clamp(220px,38vw,330px); border:0; border-radius:24px; width:100%; cursor:pointer; color:white; overflow:hidden; background:linear-gradient(135deg,#7c3aed,#0ea5e9); box-shadow:inset 0 1px #fff5,0 15px 35px #0004; transition:transform .12s,filter .2s; user-select:none; touch-action:manipulation; }
    .click-zone:hover { filter:brightness(1.1); }
    .click-zone:active,.click-zone.pressed { transform:scale(.985); }
    .click-zone::before,.click-zone::after { content:""; position:absolute; border-radius:50%; pointer-events:none; opacity:.23; }
    .click-zone::before { width:450px; height:450px; background:#fff; right:-150px; bottom:-310px; }
    .click-zone::after { width:180px; height:180px; border:24px solid #fff; left:-50px; top:-70px; }
    .zone-content { position:relative; z-index:1; display:grid; height:100%; place-content:center; text-align:center; }
    #clickNumber { font-size:clamp(4rem,13vw,8rem); font-weight:900; letter-spacing:-.09em; line-height:.86; text-shadow:0 7px 18px #0003; }
    #zoneLabel { margin-top:16px; font-weight:700; font-size:1.05rem; letter-spacing:.02em; }
    .ripple { position:absolute; width:18px; height:18px; border:2px solid #fff; border-radius:50%; transform:translate(-50%,-50%); animation:ripple .65s ease-out forwards; pointer-events:none; }
    @keyframes ripple { to { width:220px; height:220px; opacity:0; } }
    .stats { display:grid; grid-template-columns:repeat(3,1fr); gap:14px; margin-top:22px; }
    .stat { padding:17px 18px; border-radius:17px; background:#ffffff0a; border:1px solid #ffffff12; }
    .stat small { color:var(--muted); display:block; font-size:.76rem; text-transform:uppercase; letter-spacing:.09em; }
    .stat strong { display:block; margin-top:4px; font-size:1.7rem; letter-spacing:-.06em; }
    .controls { display:flex; flex-wrap:wrap; justify-content:space-between; align-items:center; gap:16px; margin-top:25px; }
    .duration { display:flex; padding:5px; gap:3px; border-radius:13px; background:#05071180; border:1px solid #ffffff15; }
    .duration button { border:0; background:transparent; color:var(--muted); border-radius:9px; padding:8px 11px; cursor:pointer; font-weight:700; }
    .duration button.active { color:white; background:#ffffff1c; }
    #reset { border:1px solid #ffffff22; border-radius:11px; padding:10px 14px; background:transparent; color:#e4e5ff; cursor:pointer; font-weight:700; }
    #reset:hover { background:#ffffff10; }
    .tip { color:var(--muted); font-size:.86rem; margin:20px 0 0; text-align:center; }
    .best { color:#fcd34d; }
    .modal { position:fixed; inset:0; z-index:10; display:grid; place-items:center; padding:20px; background:#040613a8; backdrop-filter:blur(8px); opacity:0; pointer-events:none; transition:opacity .22s ease; }
    .modal.show { opacity:1; pointer-events:auto; }
    .dialog { width:min(430px,100%); padding:32px; text-align:center; border:1px solid #ffffff25; border-radius:25px; background:linear-gradient(145deg,#242757,#101327); box-shadow:0 25px 70px #0009; transform:translateY(12px) scale(.97); transition:transform .22s ease; }
    .modal.show .dialog { transform:translateY(0) scale(1); }
    .dialog h2 { margin:0; font-size:1.2rem; color:#c9cff5; }
    #resultCps { margin:8px 0 2px; font-size:4.2rem; line-height:1; letter-spacing:-.09em; }
    #stars { color:#fbbf24; font-size:2rem; letter-spacing:.12em; margin:7px 0; text-shadow:0 3px 14px #f59e0b55; }
    #resultText { color:var(--muted); margin:0 0 23px; }
    .modal-actions { display:flex; gap:10px; justify-content:center; }
    .modal-actions button { border:0; border-radius:11px; padding:11px 16px; cursor:pointer; font-weight:800; }
    #again { color:#fff; background:linear-gradient(135deg,var(--accent),#2563eb); }
    #closeModal { color:#dfe4ff; background:#ffffff12; border:1px solid #ffffff1f !important; }
    @media (max-width:570px) { .app { width:min(100% - 20px,920px); padding:16px 0; } .panel { border-radius:22px; } .topline { align-items:start; } .stats { gap:8px; } .stat { padding:13px 11px; } .stat strong { font-size:1.38rem; } .time b { font-size:1.65rem; } }
  </style>
</head>
<body>
  <main class="app">
    <header><div class="brand"><span class="bolt">⚡</span> PulseTap</div><div class="pill">Click Speed Test</div></header>
    <section class="panel">
      <div class="topline"><div><h1>How fast can you click?</h1><p class="subtitle">Tap the large button repeatedly before the timer ends.</p></div><div class="time"><b id="timer">5.00</b><span>seconds left</span></div></div>
      <button class="click-zone" id="clickZone" aria-label="Start click speed test"><div class="zone-content"><div id="clickNumber">0</div><div id="zoneLabel">Click to start</div></div></button>
      <div class="stats"><div class="stat"><small>Clicks</small><strong id="clicks">0</strong></div><div class="stat"><small>CPS</small><strong id="cps">0.00</strong></div><div class="stat"><small>Best CPS</small><strong class="best" id="best">0.00</strong></div></div>
      <div class="controls"><div class="duration" aria-label="Test duration"><button data-seconds="3">3s</button><button data-seconds="5" class="active">5s</button><button data-seconds="10">10s</button><button data-seconds="30">30s</button></div><button id="reset">↻ Reset test</button></div>
      <p class="tip" id="message">Choose a duration, then click the button to begin.</p>
    </section>
  </main>
  <div class="modal" id="resultModal" role="dialog" aria-modal="true" aria-labelledby="resultTitle" aria-hidden="true">
    <div class="dialog">
      <h2 id="resultTitle">Your click speed</h2>
      <div id="resultCps">0.00</div>
      <div id="stars" aria-label="0 out of 5 stars">☆☆☆☆☆</div>
      <p id="resultText">Nice try!</p>
      <div class="modal-actions"><button id="again">Test again</button><button id="closeModal">Close</button></div>
    </div>
  </div>
  <script>
    const zone=document.querySelector('#clickZone'), clickNumber=document.querySelector('#clickNumber'), clicksEl=document.querySelector('#clicks'), cpsEl=document.querySelector('#cps'), bestEl=document.querySelector('#best'), timerEl=document.querySelector('#timer'), message=document.querySelector('#message'), modal=document.querySelector('#resultModal'), resultCps=document.querySelector('#resultCps'), stars=document.querySelector('#stars'), resultText=document.querySelector('#resultText');
    let seconds=5, clicks=0, running=false, ended=false, start=0, frame;
    let best=Number(localStorage.getItem('pulsetap-best')||0); bestEl.textContent=best.toFixed(2);
    function render(){ clicksEl.textContent=clicks; clickNumber.textContent=clicks; }
    function reset(){ cancelAnimationFrame(frame); clicks=0; running=false; ended=false; zone.disabled=false; timerEl.textContent=seconds.toFixed(2); cpsEl.textContent='0.00'; render(); zone.querySelector('#zoneLabel').textContent='Click to start'; message.textContent='Choose a duration, then click the button to begin.'; }
    function showResult(final){ const count=final>=12?5:final>=9?4:final>=6?3:final>=3?2:1; resultCps.textContent=final.toFixed(2)+' CPS'; stars.textContent='★'.repeat(count)+'☆'.repeat(5-count); stars.setAttribute('aria-label',`${count} out of 5 stars`); resultText.textContent=final>=12?'Lightning fast!':final>=9?'Excellent speed!':final>=6?'Great clicking!':final>=3?'Good effort — keep practicing!':'Nice start — try again!'; modal.classList.add('show'); modal.setAttribute('aria-hidden','false'); document.querySelector('#again').focus(); }
    function closeResult(){ modal.classList.remove('show'); modal.setAttribute('aria-hidden','true'); }
    function tick(now){ const elapsed=(now-start)/1000, left=Math.max(0,seconds-elapsed), cps=clicks/Math.max(elapsed,.01); timerEl.textContent=left.toFixed(2); cpsEl.textContent=cps.toFixed(2); if(left>0){ frame=requestAnimationFrame(tick); } else { running=false; ended=true; zone.disabled=true; const final=clicks/seconds; cpsEl.textContent=final.toFixed(2); zone.querySelector('#zoneLabel').textContent='Test complete'; message.textContent=`Great work! You reached ${final.toFixed(2)} CPS.`; if(final>best){ best=final; localStorage.setItem('pulsetap-best',best); bestEl.textContent=best.toFixed(2); message.textContent=`New personal best: ${final.toFixed(2)} CPS!`; } showResult(final); } }
    function splash(e){ const r=zone.getBoundingClientRect(), ripple=document.createElement('span'); ripple.className='ripple'; ripple.style.left=(e.clientX-r.left)+'px'; ripple.style.top=(e.clientY-r.top)+'px'; zone.append(ripple); ripple.addEventListener('animationend',()=>ripple.remove()); }
    zone.addEventListener('contextmenu',e=>e.preventDefault()); document.addEventListener('contextmenu',e=>e.preventDefault());
    zone.addEventListener('pointerdown',e=>{ if(e.button!==0 || zone.disabled) return; e.preventDefault(); splash(e); if(!running){ running=true; start=performance.now(); zone.querySelector('#zoneLabel').textContent='Keep clicking!'; message.textContent='Fast hands! Keep going.'; frame=requestAnimationFrame(tick); } clicks++; render(); zone.classList.add('pressed'); setTimeout(()=>zone.classList.remove('pressed'),80); });
    document.querySelectorAll('[data-seconds]').forEach(button=>button.addEventListener('click',()=>{ seconds=Number(button.dataset.seconds); document.querySelectorAll('[data-seconds]').forEach(b=>b.classList.toggle('active',b===button)); reset(); }));
    document.querySelector('#reset').addEventListener('click',reset); reset();
    document.querySelector('#again').addEventListener('click',()=>{ closeResult(); reset(); zone.focus(); });
    document.querySelector('#closeModal').addEventListener('click',closeResult);
    modal.addEventListener('pointerdown',e=>{ if(e.target===modal) closeResult(); });
  </script>
</body>
</html>
